[package]
name = "egohygiene-clippy-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"

module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

