---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  MEGALINTER_SCRIPT: "{{.ROOT_DIR}}/scripts/megalinter.sh"
  MEGALINTER_VERSION: "v9.6.0"
  MEGALINTER_REPORT_DIRECTORY: ".engineering/reports/megalinter"

env:
  MEGALINTER_VERSION: "{{.MEGALINTER_VERSION}}"
  MEGALINTER_REPORT_DIRECTORY: "{{.MEGALINTER_REPORT_DIRECTORY}}"

tasks:
  dependencies:ensure:
    desc: "Ensure locked workspace dependencies are installed"
    cmds:
      - |
        if test \
          -f "node_modules/@cspell/dict-pokemon/cspell-ext.json" \
          -a -f "node_modules/@cspell/dict-clojure/cspell-ext.json" \
          -a -f "node_modules/@cspell/dict-elisp/cspell-ext.json" \
          -a -f "node_modules/@cspell/dict-gdscript/cspell-ext.json" \
          -a -f "node_modules/@cspell/dict-gis/cspell-ext.json" \
          -a -f "node_modules/@cspell/dict-medicalterms/cspell-ext.json" \
          -a -f "node_modules/@cspell/dict-mime-types/cspell-ext.json" \
          -a -f "node_modules/@cspell/dict-mnemonics/cspell-ext.json" \
          -a -f "node_modules/@cspell/dict-people-names/cspell-ext.json" \
          -a -f "node_modules/@cspell/dict-redis/cspell-ext.json" \
          -a -f "node_modules/@cspell/dict-scientific-terms-us/cspell-ext.json" \
          -a -f "node_modules/@cspell/dict-vim/cspell-ext.json" \
          -a -f "node_modules/@cspell/dict-win32/cspell-ext.json" \
          -a -d "node_modules/@cspell/cspell-json-reporter"; then
          printf '%s\n' "Workspace dependencies are already installed."
          exit 0
        fi

        printf '%s\n' "Installing locked workspace dependencies..."

        pnpm install \
          --frozen-lockfile

  default:
    desc: "Run the complete MegaLinter quality suite"
    cmds:
      - task: all

  doctor:
    desc: "Validate MegaLinter runtime and repository configuration"
    cmds:
      - '"{{.MEGALINTER_SCRIPT}}" --doctor'

  dry-run:
    desc: "Print the redacted MegaLinter container command"
    cmds:
      - '"{{.MEGALINTER_SCRIPT}}" --dry-run'

  all:
    desc: "Lint the complete repository with all enabled linters"
    cmds:
      - '"{{.MEGALINTER_SCRIPT}}"'

  changed:
    desc: "Lint only files changed in the current Git worktree"
    cmds:
      - '"{{.MEGALINTER_SCRIPT}}" --changed-only'

  fix:
    desc: "Apply fixes from all supported linters"
    cmds:
      - '"{{.MEGALINTER_SCRIPT}}" --fix'

  debug:
    desc: "Run MegaLinter with diagnostic output"
    cmds:
      - '"{{.MEGALINTER_SCRIPT}}" --debug'

  actionlint:
    desc: "Validate GitHub Actions workflows with actionlint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "ACTION_ACTIONLINT"

  ansible:
    desc: "Run the Ansible descriptor family"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --descriptors "ANSIBLE"

  arm:
    desc: "Validate Azure Resource Manager templates with ARM TTK"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "ARM_ARM_TTK"

  cljstyle:
    desc: "Validate Clojure formatting with cljstyle"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "CLOJURE_CLJSTYLE"

  clj-kondo:
    desc: "Analyze Clojure source with clj-kondo"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "CLOJURE_CLJ_KONDO"

  cloudformation:
    desc: "Validate AWS CloudFormation templates with cfn-lint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "CLOUDFORMATION_CFN_LINT"

  coffeescript:
    desc: "Validate CoffeeScript source with CoffeeLint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "COFFEE_COFFEELINT"

  jscpd:
    desc: "Detect duplicated source blocks with jscpd"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "COPYPASTE_JSCPD"

  clang-format:
    desc: "Validate C and C++ formatting with clang-format"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "CPP_CLANG_FORMAT"

  clang-format-c:
    desc: "Validate C formatting with clang-format"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "C_CLANG_FORMAT"

  stylelint:
    desc: "Validate CSS and stylesheet conventions with Stylelint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "CSS_STYLELINT"

  stylelint:fix:
    desc: "Fix supported CSS findings with Stylelint"
    env:
      APPLY_FIXES: "CSS_STYLELINT"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "CSS_STYLELINT"

  dart-analyze:
    desc: "Analyze Dart and Flutter source with Dart Analyzer"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "DART_DARTANALYZER"

  dockerfile:
    desc: "Run the Dockerfile descriptor family"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --descriptors "DOCKERFILE"

  hadolint:
    desc: "Validate Dockerfiles with Hadolint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "DOCKERFILE_HADOLINT"

  editorconfig:
    desc: "Validate files against EditorConfig policy"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "EDITORCONFIG_EDITORCONFIG_CHECKER"

  gherkin:
    desc: "Validate Gherkin feature files with gherkin-lint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "GHERKIN_GHERKIN_LINT"

  revive:
    desc: "Analyze Go source with Revive"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "GO_REVIVE"

  graphql-schema:
    desc: "Validate GraphQL schema conventions"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "GRAPHQL_GRAPHQL_SCHEMA_LINTER"

  groovy:
    desc: "Validate Groovy and Jenkinsfiles with npm-groovy-lint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "GROOVY_NPM_GROOVY_LINT"

  htmlhint:
    desc: "Validate HTML structure and accessibility with HTMLHint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "HTML_HTMLHINT"

  eslint:
    desc: "Analyze JavaScript, TypeScript, and React source with ESLint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "JAVASCRIPT_ES"

  prettier:
    desc: "Validate supported files with Prettier"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "JAVASCRIPT_PRETTIER"

  prettier:fix:
    desc: "Format supported files with Prettier"
    env:
      APPLY_FIXES: "JAVASCRIPT_PRETTIER"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "JAVASCRIPT_PRETTIER" --fix

  checkstyle:
    desc: "Analyze Java source with Checkstyle"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "JAVA_CHECKSTYLE"

  pmd:
    desc: "Analyze Java source with PMD"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "JAVA_PMD"

  jsonlint:
    desc: "Validate strict JSON syntax with jsonlint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "JSON_JSONLINT"

  npm-package-json:
    desc: "Validate package.json files with npm-package-json-lint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "JSON_NPM_PACKAGE_JSON_LINT"

  prettier-json:
    desc: "Validate JSON formatting with Prettier"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "JSON_PRETTIER"

  prettier-json:fix:
    desc: "Format JSON files with Prettier"
    env:
      APPLY_FIXES: "JSON_PRETTIER"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "JSON_PRETTIER" --fix

  eslint-jsx:
    desc: "Analyze JSX source with the repository ESLint toolchain"
    cmds:
      - >-
        pnpm exec eslint
        --config ".config/lint/javascript/eslint.config.mjs"
        "**/*.jsx"

  chktex:
    desc: "Analyze LaTeX source with ChkTeX"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "LATEX_CHKTEX"

  luacheck:
    desc: "Analyze Lua source with Luacheck"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "LUA_LUACHECK"

  checkmake:
    desc: "Analyze Makefiles with Checkmake"
    cmds:
      - |
        find . \
          \( \
            -path "./.git" \
            -o -path "*/node_modules" \
            -o -path "*/vendor" \
            -o -path "*/.venv" \
            -o -path "*/venv" \
            -o -path "*/dist" \
            -o -path "*/build" \
            -o -path "*/coverage" \
            -o -path "*/.cache" \
          \) \
          -prune \
          -o \
          -type f \
          \( \
            -name "Makefile" \
            -o -name "GNUmakefile" \
            -o -name "*.mk" \
            -o -name "*.make" \
          \) \
          -exec sh -c '
            status=0

            for makefile_path do
              if ! checkmake \
                --config ".config/lint/makefile/.checkmake.ini" \
                "${makefile_path}"; then
                status=1
              fi
            done

            exit "${status}"
          ' sh {} +
    silent: true

  markdownlint:
    desc: "Analyze Markdown files with markdownlint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "MARKDOWN_MARKDOWNLINT"

  markdownlint:fix:
    desc: "Fix supported Markdown findings with markdownlint"
    env:
      APPLY_FIXES: "MARKDOWN_MARKDOWNLINT"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "MARKDOWN_MARKDOWNLINT" --fix

  markdown-link-check:
    desc: "Validate links in Markdown files"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "MARKDOWN_MARKDOWN_LINK_CHECK"

  remark-lint:
    desc: "Analyze Markdown syntax trees with remark-lint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "MARKDOWN_REMARK_LINT"

  phpcs:
    desc: "Validate PHP coding conventions with PHP_CodeSniffer"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "PHP_PHPCS"

  phpcs:fix:
    desc: "Fix supported PHP coding-standard findings with PHPCBF"
    env:
      APPLY_FIXES: "PHP_PHPCS"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "PHP_PHPCS"

  phplint:
    desc: "Validate PHP syntax with PHPLint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "PHP_PHPLINT"

  phpstan:
    desc: "Analyze PHP types and correctness with PHPStan"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "PHP_PHPSTAN"

  psalm:
    desc: "Analyze PHP types and data flow with Psalm"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "PHP_PSALM"

  php:
    desc: "Run the complete PHP analysis suite"
    cmds:
      - task: "phplint"
      - task: "phpcs"
      - task: "phpstan"
      - task: "psalm"

  powershell:
    desc: "Analyze PowerShell source with PSScriptAnalyzer"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "POWERSHELL_POWERSHELL"

  powershell-formatter:
    desc: "Validate PowerShell formatting with PSScriptAnalyzer"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "POWERSHELL_POWERSHELL_FORMATTER"

  powershell-formatter:fix:
    desc: "Format PowerShell source with PSScriptAnalyzer"
    env:
      APPLY_FIXES: "POWERSHELL_POWERSHELL_FORMATTER"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "POWERSHELL_POWERSHELL_FORMATTER" --fix

  powershell-all:
    desc: "Run PowerShell analysis and formatting checks"
    cmds:
      - task: "powershell"
      - task: "powershell-formatter"

  protolint:
    desc: "Analyze Protocol Buffer definitions with protolint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "PROTOBUF_PROTOLINT"

  protolint:fix:
    desc: "Fix supported Protocol Buffer style findings with protolint"
    env:
      APPLY_FIXES: "PROTOBUF_PROTOLINT"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "PROTOBUF_PROTOLINT" --fix

  puppet-lint:
    desc: "Analyze Puppet manifests with puppet-lint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "PUPPET_PUPPET_LINT"

  raku:
    desc: "Compile and validate Raku source files"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "RAKU_RAKU"

  ls-lint:
    desc: "Validate repository file and directory naming conventions"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "REPOSITORY_LS_LINT"

  cspell:
    desc: "Spell-check repository source and documentation with CSpell"
    deps:
      - "dependencies:ensure"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SPELL_CSPELL"

  checkov:
    desc: "Scan infrastructure-as-code and deployment configuration with Checkov"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "REPOSITORY_CHECKOV"

  devskim:
    desc: "Scan repository source for insecure coding patterns with DevSkim"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "REPOSITORY_DEVSKIM"

  grype:
    desc: "Scan repository packages for known vulnerabilities with Grype"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "REPOSITORY_GRYPE"

  kics:
    desc: "Scan infrastructure-as-code with KICS"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "REPOSITORY_KICS"

  syft:
    desc: "Generate repository SBOMs with Syft"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "REPOSITORY_SYFT"

  rstcheck:
    desc: "Validate reStructuredText syntax and embedded code with rstcheck"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "RST_RSTCHECK"

  rubocop:
    desc: "Analyze Ruby source with RuboCop"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "RUBY_RUBOCOP"

  rubocop:fix:
    desc: "Apply safe RuboCop autocorrections"
    env:
      APPLY_FIXES: "RUBY_RUBOCOP"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "RUBY_RUBOCOP" --fix

  clippy:
    desc: "Analyze Rust crates with Clippy"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "RUST_CLIPPY"

  clippy:fix:
    desc: "Apply supported Clippy fixes"
    env:
      APPLY_FIXES: "RUST_CLIPPY"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "RUST_CLIPPY" --fix

  lintr:
    desc: "Analyze R and R Markdown source with lintr"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "R_LINTR"

  trivy:
    desc: "Scan repository security with Trivy"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "REPOSITORY_TRIVY"

  trivy-sbom:
    desc: "Generate a CycloneDX repository SBOM with Trivy"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "REPOSITORY_TRIVY_SBOM"

  trivy-all:
    desc: "Run Trivy security scanning and SBOM generation"
    cmds:
      - task: "trivy"
      - task: "trivy-sbom"

  trufflehog:
    desc: "Scan repository files for exposed credentials with TruffleHog"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "REPOSITORY_TRUFFLEHOG"

  eslint-tsx:
    desc: "Analyze TSX source with the repository ESLint toolchain"
    deps:
      - "dependencies:ensure"
    cmds:
      - >-
        pnpm exec eslint
        --config ".config/lint/javascript/eslint.config.mjs"
        --cache
        --cache-location ".cache/eslint/tsx"
        --cache-strategy "content"
        "**/*.tsx"

  eslint-typescript:
    desc: "Analyze TypeScript source with the repository ESLint toolchain"
    deps:
      - "dependencies:ensure"
    cmds:
      - >-
        pnpm exec eslint
        --config ".config/lint/javascript/eslint.config.mjs"
        --cache
        --cache-location ".cache/eslint/typescript"
        --cache-strategy "content"
        "**/*.ts"

  prettier-typescript:
    desc: "Validate TypeScript formatting with Prettier"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "TYPESCRIPT_PRETTIER"

  prettier-typescript:fix:
    desc: "Format TypeScript files with Prettier"
    env:
      APPLY_FIXES: "TYPESCRIPT_PRETTIER"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "TYPESCRIPT_PRETTIER" --fix

  prettier-yaml:
    desc: "Validate YAML formatting with Prettier"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "YAML_PRETTIER"

  prettier-yaml:fix:
    desc: "Format YAML files with Prettier"
    env:
      APPLY_FIXES: "YAML_PRETTIER"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "YAML_PRETTIER" --fix

  terrascan:
    desc: "Run deprecated Terrascan compatibility analysis"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "TERRAFORM_TERRASCAN"

  tflint:
    desc: "Analyze Terraform modules with TFLint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "TERRAFORM_TFLINT"

  terragrunt:
    desc: "Validate Terragrunt HCL formatting"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "TERRAFORM_TERRAGRUNT"

  terragrunt:fix:
    desc: "Format Terragrunt HCL files"
    env:
      APPLY_FIXES: "TERRAFORM_TERRAGRUNT"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "TERRAFORM_TERRAGRUNT" --fix

  tekton-lint:
    desc: "Analyze Tekton Tasks and Pipelines with tekton-lint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "TEKTON_TEKTON_LINT"

  yamllint:
    desc: "Validate YAML syntax and style with yamllint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "YAML_YAMLLINT"

  v8r-yaml:
    desc: "Validate YAML files against matching JSON Schemas with v8r"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "YAML_V8R"

  swiftlint:
    desc: "Analyze Swift source with SwiftLint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SWIFT_SWIFTLINT"

  swiftlint:fix:
    desc: "Apply supported SwiftLint corrections"
    env:
      APPLY_FIXES: "SWIFT_SWIFTLINT"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SWIFT_SWIFTLINT" --fix

  scalafix:
    desc: "Analyze and rewrite Scala syntax with Scalafix"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SCALA_SCALAFIX"

  scalafix:fix:
    desc: "Apply supported Scalafix syntactic rewrites"
    env:
      APPLY_FIXES: "SCALA_SCALAFIX"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SCALA_SCALAFIX" --fix

  salesforce-apex:
    desc: "Analyze Salesforce Apex with Code Analyzer"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SALESFORCE_CODE_ANALYZER_APEX"

  snakefmt:
    desc: "Validate Snakemake formatting with Snakefmt"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SNAKEMAKE_SNAKEFMT"

  snakefmt:fix:
    desc: "Format Snakemake files with Snakefmt"
    env:
      APPLY_FIXES: "SNAKEMAKE_SNAKEFMT"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SNAKEMAKE_SNAKEFMT" --fix

  gitleaks:
    desc: "Scan Git history for committed credentials with Gitleaks"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "REPOSITORY_GITLEAKS"

  tsqllint:
    desc: "Analyze T-SQL source with TSQLLint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SQL_TSQLLINT"

  tsqllint:fix:
    desc: "Apply supported TSQLLint fixes"
    env:
      APPLY_FIXES: "SQL_TSQLLINT"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SQL_TSQLLINT" --fix

  sqlfluff:
    desc: "Analyze SQL syntax and style with SQLFluff"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SQL_SQLFLUFF"

  sqlfluff:fix:
    desc: "Apply supported SQLFluff formatting fixes"
    env:
      APPLY_FIXES: "SQL_SQLFLUFF"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SQL_SQLFLUFF" --fix

  proselint:
    desc: "Analyze technical prose with Proselint"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SPELL_PROSELINT"

  vale:
    desc: "Analyze editorial style and terminology with Vale"
    cmds:
      - >-
        "{{.MEGALINTER_SCRIPT}}"
        --linters "SPELL_VALE"

  prose:
    desc: "Run the complete prose-quality suite"
    cmds:
      - task: "proselint"
      - task: "vale"
      - task: "cspell"

  lychee:
    desc: "Validate repository links with Lychee"
