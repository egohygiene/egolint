owner = "egohygiene/egolint"
tool-id = "EGOLINT_REPOSITORY_INTELLIGENCE"
policy-source = ".config/rules/repository-intelligence.v1.toml"

[[upstream-contracts]]
id = "egohygiene.architecture-decision/v1"
version = "1.1.0"
authority = "accepted"
