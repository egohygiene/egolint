# Exact alternative; the alpha.1 source-validation policy remains supported.
[[compatible-upstream-contracts]]
id = "egohygiene.repository-intelligence/v1"
version = "1.0.0-alpha.2"
authority = "proposed"
source-repository = "egohygiene/hygiene"
source-revision = "639a003d5ddc4d242c2cf190eeb59a9fc522d199"
source-path = "schemas/repository-intelligence.alpha2.schema.json"

# Canonical Hygiene authority at the accepted ADR ratification revision.
# The wider contract index may grow; only its ADR authority entries are checked.
[canonical-policy-owner]
repository = "egohygiene/hygiene"
source-revision = "c589587395750cd1c79c6fa0bef010189c547249"
catalog-path = "catalog/contracts.yaml"

[canonical-policy-owner.artifact-sha256]
"docs/decisions/POLICY.md" = "e8b1f3c379a56d389d7689d187b2932ff3cfdf5e80acc829d244fb2527fcd361"
"docs/decisions/RATIFICATION.md" = "0d3569c85955ae0412b4cd6778c1d6cdc899f4fc9b93e89795343ea82af043d1"
"schemas/architecture-decision.v1.schema.json" = "491eae26e498ee311bb37d5eff23a51d682eb687196c80a3df10ac1ce98e04d4"
"schemas/architecture-decision-policy-reference.v1.schema.json" = "fdf451cfa38ba666ec579aa75d2acbd52a56b95e73c7437565b79dfcfb689216"

[[rules]]
id = "EGO-INTEL-CONTRACT-001"
title = "Repository Intelligence contracts use supported immutable pins"
default-severity = "error"
contracts = [
  "egohygiene.architecture-decision/v1",
  "egohygiene.architecture-decision-policy-reference/v1",
  "hygiene.roadmap/v1alpha1",
  "egohygiene.repository-intelligence/v1",
]
remediation = "Use the exact supported Hygiene contract pins; canonical-owner selection also requires the pinned authority files and ADR catalog entries."

[[rules]]
id = "EGO-INTEL-ADOPTION-001"
title = "Adoption and evidence availability remain explicit"
default-severity = "warning"
contracts = ["egohygiene.repository-intelligence/v1"]
remediation = "Declare each surface present, unknown, or not-applicable; provide a represented commit before claiming complete evidence."

[[rules]]
id = "EGO-INTEL-ADR-METADATA-001"
title = "ADR metadata and document anatomy match the inherited contract"
default-severity = "error"
contracts = ["egohygiene.architecture-decision/v1"]
remediation = "Repair the first YAML front matter document, filename/ID agreement, required fields, or required section order."

[[rules]]
id = "EGO-INTEL-ADR-LIFECYCLE-001"
title = "ADR lifecycle claims preserve human disposition authority"
default-severity = "error"
contracts = ["egohygiene.architecture-decision/v1"]
remediation = "Keep new records proposed or attach durable human approval evidence required by the declared terminal state."

[[rules]]
id = "EGO-INTEL-ADR-INDEX-001"
title = "The ADR index has exactly one canonical entry per record"
default-severity = "error"
contracts = ["egohygiene.architecture-decision/v1"]
remediation = "Add or repair the canonical relative index link and remove duplicate entries without deleting historical records."

[[rules]]
id = "EGO-INTEL-ADR-LINEAGE-001"
title = "ADR references and supersession remain resolvable and bidirectional"
default-severity = "error"
contracts = ["egohygiene.architecture-decision/v1"]
remediation = "Resolve dangling decision references, add the reciprocal supersession link, and remove lineage cycles."

[[rules]]
id = "EGO-INTEL-ROADMAP-STRUCTURE-001"
title = "Roadmap manifests and steps use stable versioned structure"
default-severity = "error"
contracts = ["hygiene.roadmap/v1alpha1"]
remediation = "Repair the roadmap manifest or step metadata, use a unique stable ID, and keep one outcome plus checklist exit criteria."

[[rules]]
id = "EGO-INTEL-ROADMAP-STATE-001"
title = "Roadmap states agree with exit criteria and dependencies"
default-severity = "error"
contracts = ["hygiene.roadmap/v1alpha1"]
remediation = "Reconcile the declared state with checklist completion and ensure active or ready work has complete dependencies."

[[rules]]
id = "EGO-INTEL-LINK-001"
title = "Declared issue, pull request, commit, and cross-record links are structural"
default-severity = "error"
contracts = [
  "egohygiene.architecture-decision/v1",
  "hygiene.roadmap/v1alpha1",
  "egohygiene.repository-intelligence/v1",
]
remediation = "Use a canonical HTTPS GitHub URL or a declared local/fully-qualified stable reference."

[[rules]]
id = "EGO-INTEL-TRAILER-001"
title = "Optional Repository Intelligence commit trailers resolve"
default-severity = "error"
contracts = ["egohygiene.repository-intelligence/v1"]
remediation = "Use one resolvable Roadmap-Step or ADR-Ref value per trailer line, or remove the malformed optional trailer."

[[rules]]
id = "EGO-INTEL-CYCLE-001"
title = "Roadmap dependencies and ADR supersession are acyclic"
default-severity = "error"
contracts = [
  "egohygiene.architecture-decision/v1",
  "hygiene.roadmap/v1alpha1",
]
remediation = "Remove at least one dependency or supersession edge so the declared graph is acyclic."
