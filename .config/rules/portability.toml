schema-version = 1
owner = "egohygiene/egolint"
policy-source = ".config/rules/portability.toml"

[[rules]]
id = "EGO-PORT-CASE-001"
title = "Repository paths must not collide on case-insensitive filesystems"
category = "case"
severity = "error"
suppressible = true
description = "Reject two repository paths whose ASCII case-folded forms are identical."
evidence = [
  "https://learn.microsoft.com/en-us/windows/win32/fileio/naming-a-file",
]

[[rules]]
id = "EGO-PORT-PATH-001"
title = "Repository path segments must be valid on Windows"
category = "path"
severity = "error"
suppressible = true
description = "Reject reserved device names, reserved characters, control characters, and trailing spaces or periods."
evidence = [
  "https://learn.microsoft.com/en-us/windows/win32/fileio/naming-a-file",
]

[[rules]]
id = "EGO-PORT-EOL-001"
title = "Text files must not contain mixed or legacy carriage-return endings"
category = "line-ending"
severity = "error"
suppressible = true
description = "Reject mixed LF/CRLF content and lone carriage returns in text files."
evidence = [
  "https://git-scm.com/docs/gitattributes",
  "https://git-scm.com/docs/gitfaq",
]

[[rules]]
id = "EGO-PORT-EOL-002"
title = "Portable scripts and automation files must use LF endings"
category = "line-ending"
severity = "error"
suppressible = true
description = "Require LF in shell, PowerShell, workflow, and Dev Container automation files; batch files remain eligible for CRLF."
evidence = [
  "https://git-scm.com/docs/gitattributes",
  "https://git-scm.com/docs/gitfaq",
]

[[rules]]
id = "EGO-PORT-EXEC-001"
title = "Interpreter shebang scripts must be executable in the Git index"
category = "executable"
severity = "error"
suppressible = true
description = "Require executable Git mode when a file starts with an absolute interpreter shebang; language syntax such as Rust inner attributes is excluded."
evidence = [
  "https://git-scm.com/docs/git-update-index#Documentation/git-update-index.txt---chmod-x",
]

[[rules]]
id = "EGO-PORT-HOME-001"
title = "Portable automation must not embed a workstation home directory"
category = "environment"
severity = "warning"
suppressible = true
description = "Detect macOS, Linux, and Windows user-home literals in portable automation surfaces."
evidence = [
  "https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/V1_chap08.html",
  "https://learn.microsoft.com/en-us/windows/win32/fileio/naming-a-file",
]

[[rules]]
id = "EGO-PORT-CMD-001"
title = "Portable shell code must not assume a GNU- or BSD-specific command form"
category = "command"
severity = "warning"
suppressible = true
description = "Identify command forms with known GNU/BSD differences so the script can branch, use a wrapper, or document its platform scope."
evidence = [
  "https://pubs.opengroup.org/onlinepubs/9799919799/idx/utilities.html",
]

[[rules]]
id = "EGO-PORT-WORKFLOW-001"
title = "Multi-OS workflow run steps must select an explicit shell"
category = "shell"
severity = "warning"
suppressible = true
description = "GitHub selects different default shells on Windows and non-Windows runners; an explicit shell makes command semantics reviewable."
evidence = [
  "https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_iddefaultsrun",
]
