# ==============================================================================
# Ego Hygiene - Universal SQLFluff Configuration
# ==============================================================================
#
# Purpose:
#   Provide a portable ANSI SQL baseline for syntax, layout, capitalization,
#   maintainability, and deterministic formatting.
#
# Dialect-specific repositories should override this through an egolint profile
# or a repository-local SQLFluff configuration.
#
# References:
#   https://docs.sqlfluff.com/en/stable/configuration/
#   https://docs.sqlfluff.com/en/stable/reference/rules.html
# ==============================================================================

[sqlfluff]

# SQLFluff requires an explicit dialect.
dialect = ansi

# Treat files as ordinary SQL by default.
#
# Jinja and dbt repositories should use a dedicated profile because templating
# requires project context, variables, macros, and sometimes adapter packages.
templater = raw

# Apply the complete built-in rule catalog, minus a small set of rules that are
# controversial or unsuitable for a universal polyglot baseline.
rules = all
exclude_rules = ambiguous.column_count, structure.column_order

# Match the repository's prose and configuration readability boundary.
max_line_length = 120

# Use four workers while remaining predictable on local machines and in CI.
processes = 4

# Keep parsing and templating failures visible.
ignore =

# Include only canonical SQL files in this shared baseline.
sql_file_exts = .sql

# Preserve inline noqa controls for intentional exceptions.
disable_noqa = false

# Use UTF-8 deterministically.
encoding = utf-8

# Prevent endless formatting passes on unstable or conflicting rules.
runaway_limit = 10

[sqlfluff:indentation]

indent_unit = space
tab_space_size = 4

# Keep JOIN clauses aligned with their parent query rather than deeply nested.
indented_joins = false
indented_using_on = true

# Permit implicit indentation where the grammar makes nesting clear.
implicit_indents = allow

# Do not add extra indentation solely because SQL is templated.
template_blocks_indent = false

[sqlfluff:layout:type:comma]

# Prefer trailing commas in SELECT lists and similar constructs.
line_position = trailing

[sqlfluff:layout:type:binary_operator]

line_position = leading

[sqlfluff:layout:type:comparison_operator]

line_position = leading

[sqlfluff:rules:capitalisation.keywords]

capitalisation_policy = upper

[sqlfluff:rules:capitalisation.literals]

capitalisation_policy = upper

[sqlfluff:rules:capitalisation.functions]

extended_capitalisation_policy = upper
