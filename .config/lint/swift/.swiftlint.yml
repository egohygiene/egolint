---
# ==============================================================================
# Ego Hygiene - Universal SwiftLint Configuration
# ==============================================================================
#
# Purpose:
#   Enforce safe, readable, and maintainable Swift conventions without assuming
#   a specific Apple UI framework or project layout.
#
# References:
#   https://github.com/realm/SwiftLint
#   https://realm.github.io/SwiftLint/rule-directory.html
# ==============================================================================

# Treat warnings as failures in local runs as well as MegaLinter.
strict: true

# A selected linter should fail when its file-discovery boundary is incorrect.
allow_zero_lintable_files: false

# The execution environment pins SwiftLint; runtime update checks add no value.
check_for_updates: false

# Keep the standard Swift/Xcode-compatible output consumed by MegaLinter.
reporter: "xcode"

# ==============================================================================
# Opt-in rules
# ==============================================================================

opt_in_rules:
  # Layout and consistency
  - attributes
  - closure_spacing
  - collection_alignment
  - modifier_order

  # Clarity and simplification
  - contains_over_filter_count
  - empty_collection_literal
  - empty_count
  - empty_enum_arguments
  - empty_string
  - explicit_init
  - first_where
  - implicit_return
  - last_where

# ==============================================================================
# Rule configuration
# ==============================================================================

# Force casts can terminate execution and should be exceptional and local.
force_cast:
  severity: error

# Force-try expressions can terminate execution and should be exceptional.
force_try:
  severity: error

# Permit readable prose while retaining a hard upper safety boundary.
line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

# Keep ordinary identifiers descriptive while allowing conventional short names.
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - URL
    - URI
    - UUID

# Keep functions focused while allowing a reasonable amount of implementation.
function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 10
  error: 20

nesting:
  type_level:
    warning: 2
    error: 3
  function_level:
    warning: 3
    error: 5

# ==============================================================================
# Exclusions
# ==============================================================================
#
# Paths are relative to this nested configuration file:
#
#   .config/lint/swift/.swiftlint.yml
#   ../../.. -> repository root
#
# Do not add an `included:` list here. SwiftLint already scans the repository,
# and a universal config should not assume every project uses Sources/Tests.

excluded:
  # Dependencies
  - "../../../Carthage"
  - "../../../Carthage/**"
  - "../../../Pods"
  - "../../../Pods/**"
  - "../../../Vendor"
  - "../../../Vendor/**"
  - "../../../vendor"
  - "../../../vendor/**"
  - "../../../node_modules"
  - "../../../node_modules/**"

  # Swift Package Manager output
  - "../../../.build"
  - "../../../.build/**"

  # Xcode-generated and dependency state
  - "../../../DerivedData"
  - "../../../DerivedData/**"
  - "../../../**/DerivedData/**"
  - "../../../**/SourcePackages/checkouts/**"
  - "../../../**/SourcePackages/artifacts/**"

  # Generic generated output
  - "../../../build"
  - "../../../build/**"
  - "../../../dist"
  - "../../../dist/**"
  - "../../../coverage"
  - "../../../coverage/**"
  - "../../../generated"
  - "../../../generated/**"

  # Repository runtime output
  - "../../../.cache"
  - "../../../.cache/**"
  - "../../../.reports"
  - "../../../.reports/**"

  # Common generated Swift source
  - "../../../**/*.generated.swift"
  - "../../../**/Generated/**"
