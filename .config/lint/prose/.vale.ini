# ==============================================================================
# Ego Hygiene - Universal Vale Configuration
# ==============================================================================
#
# Purpose:
#   Apply syntax-aware editorial checks to Markdown, reStructuredText, and
#   plain-text documentation.
#
# References:
#   https://vale.sh/docs/
# ==============================================================================

StylesPath = styles

MinAlertLevel = warning

Packages = write-good

[formats]
txt = md

[*.{md,rst,txt}]
BasedOnStyles = Vale, write-good

# CSpell is the canonical spelling engine.
Vale.Spelling = NO

# Retain Vale's high-signal built-in checks.
Vale.Repetition = YES
Vale.Terms = YES
Vale.Avoid = YES
