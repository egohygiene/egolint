# ==============================================================================
# Ego Hygiene - Universal isort Compatibility Configuration
# ==============================================================================
#
# Purpose:
#   Preserve Black-compatible import sorting for projects using the optional
#   legacy Python compatibility profile.
#
# Ruff's I rules own import sorting in the universal profile.
#
# References:
#   https://isort.readthedocs.io/en/latest/configuration/
# ==============================================================================
[settings]
profile = black

py_version = 312
line_length = 100

atomic = True
honor_noqa = True
skip_gitignore = True

combine_as_imports = True
force_sort_within_sections = True

src_paths =
    .
    src
    app
    scripts
    tests

known_first_party =
    app
    src

extend_skip =
    .cache
    .mypy_cache
    .pytest_cache
    .ruff_cache
    .venv
    build
    coverage
    dist
    generated
    node_modules
    out
    target
    vendor
    venv
    .engineering/reports

extend_skip_glob =
    **/*.generated.py
    **/*_pb2.py
    **/*_pb2_grpc.py
