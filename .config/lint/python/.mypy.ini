# ==============================================================================
# Ego Hygiene - Universal Mypy Configuration
# ==============================================================================
#
# Purpose:
#   Apply strict static typing to first-party Python while remaining usable in
#   a generic lint container that may not contain every consumer dependency.
#
# References:
#   https://mypy.readthedocs.io/en/stable/config_file.html
# ==============================================================================

[mypy]

python_version = 3.12

# ------------------------------------------------------------------------------
# Strict typing baseline
# ------------------------------------------------------------------------------

strict = True

disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_subclassing_any = True

check_untyped_defs = True

no_implicit_optional = True
strict_optional = True
strict_equality = True
strict_equality_for_none = True

implicit_reexport = False

# ------------------------------------------------------------------------------
# Diagnostics
# ------------------------------------------------------------------------------

pretty = True
show_error_codes = True
show_column_numbers = True
show_error_context = True

warn_no_return = True
warn_return_any = True
warn_redundant_casts = True
warn_unreachable = True
warn_unused_ignores = True

# `warn_unused_configs` only fully works with incremental mode disabled, so do
# not enable it in this cache-enabled baseline.
warn_unused_configs = False

# ------------------------------------------------------------------------------
# Imports
# ------------------------------------------------------------------------------

follow_imports = normal

# A generic EgoLint image cannot guarantee every consumer dependency or stub
# package is installed. First-party code remains strict, while missing external
# type information does not make the shared profile unusable.
ignore_missing_imports = True

# ------------------------------------------------------------------------------
# Namespace and script behavior
# ------------------------------------------------------------------------------

namespace_packages = True
explicit_package_bases = True
scripts_are_modules = True

# ------------------------------------------------------------------------------
# Cache and performance
# ------------------------------------------------------------------------------

incremental = True
cache_dir = .cache/mypy

# ------------------------------------------------------------------------------
# File discovery
# ------------------------------------------------------------------------------

files = .

exclude = (?x)(
    (^|/)\.cache/
  | (^|/)\.git/
  | (^|/)\.mypy_cache/
  | (^|/)\.pytest_cache/
  | (^|/)\.ruff_cache/
  | (^|/)\.tox/
  | (^|/)\.venv/
  | (^|/)__pycache__/
  | (^|/)build/
  | (^|/)coverage/
  | (^|/)dist/
  | (^|/)generated/
  | (^|/)node_modules/
  | (^|/)out/
  | (^|/)target/
  | (^|/)vendor/
  | (^|/)venv/
  | (^|/)\.engineering/reports/
)
