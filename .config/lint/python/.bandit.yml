---
# ==============================================================================
# Ego Hygiene - Universal Bandit Configuration
# ==============================================================================

# Keep all built-in security tests enabled.
tests: []

# Do not suppress security checks globally.
skips: []

exclude_dirs:
  - ".cache"
  - ".git"
  - ".mypy_cache"
  - ".pytest_cache"
  - ".ruff_cache"
  - ".tox"
  - ".venv"
  - "__pycache__"
  - "build"
  - "coverage"
  - "dist"
  - "generated"
  - "node_modules"
  - "out"
  - "target"
  - "vendor"
  - "venv"
  - ".reports"

# Assertions are normal test-framework behavior, but remain checked in
# production source.
assert_used:
  skips:
    - "*/tests/*"
    - "*/test_*.py"
