# ==============================================================================
# Ego Hygiene - Universal Scalafix Configuration
# ==============================================================================
#
# Purpose:
#   Apply safe built-in syntactic Scala rules that do not require SemanticDB.
#
# Important:
#   MegaLinter does not compile Scala or generate SemanticDB before invoking
#   Scalafix, so semantic rules belong in project-native sbt or Scala CLI tasks.
#
# References:
#   https://scalacenter.github.io/scalafix/docs/users/configuration.html
#   https://scalacenter.github.io/scalafix/docs/rules/overview.html
# ==============================================================================

rules = [
  DisableSyntax,
  LeakingImplicitClassVal,
  NoValInForComprehension,
  ProcedureSyntax,
  RedundantSyntax
]

# ------------------------------------------------------------------------------
# Disabled syntax
# ------------------------------------------------------------------------------

# Reject mutable variables in the universal baseline.
DisableSyntax.noVars = true

# Reject null literals.
DisableSyntax.noNulls = true

# Reject return statements.
DisableSyntax.noReturns = true

# Reject XML literals, which complicate parsing and portability.
DisableSyntax.noXml = true

# Reject universal equality operators.
DisableSyntax.noUniversalEquality = true

# Avoid outdated terminology in identifiers and comments.
DisableSyntax.regex = [
  {
    id = "outdated-extension-term"
    pattern = "(?i)\\bpimp(?:ed|ing|s)?\\b"
    message = "Use clearer terminology such as extension, enrichment, or syntax."
  }
]

# ------------------------------------------------------------------------------
# Redundant syntax cleanup
# ------------------------------------------------------------------------------

RedundantSyntax.finalObject = true
RedundantSyntax.stringInterpolator = true
