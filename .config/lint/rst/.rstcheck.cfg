# ==============================================================================
# Ego Hygiene - Universal rstcheck Configuration
# ==============================================================================
#
# Purpose:
#   Validate reStructuredText syntax and supported embedded code blocks while
#   recognizing common Sphinx directives and roles.
#
# References:
#   https://rstcheck.readthedocs.io/en/latest/usage/config/
#   https://github.com/rstcheck/rstcheck
# ==============================================================================

[rstcheck]

# Report warnings and errors. Informational diagnostics remain suppressed.
report_level = warning

# Sphinx directives that docutils does not understand without the complete
# Sphinx extension environment.
ignore_directives =
    automodule,
    autoclass,
    autofunction,
    automethod,
    autodata,
    autoattribute,
    autoproperty,
    autosummary,
    currentmodule,
    deprecated,
    envvar,
    glossary,
    index,
    literalinclude,
    module,
    object,
    only,
    productionlist,
    program,
    seealso,
    tab,
    tab-set,
    toctree,
    versionadded,
    versionchanged

# Common Sphinx and Python-domain interpreted-text roles.
ignore_roles =
    any,
    attr,
    class,
    command,
    const,
    data,
    doc,
    download,
    envvar,
    exc,
    file,
    func,
    keyword,
    mailheader,
    manpage,
    meth,
    mimetype,
    mod,
    numref,
    option,
    pep,
    program,
    ref,
    regexp,
    rfc,
    term

# Keep substitutions strict by default. Add specific repository-owned
# substitutions here only when rstcheck cannot resolve them.
ignore_substitutions =

# Suppress only narrowly understood parser messages. Broad patterns such as
# "Unknown directive type" and "Unknown interpreted text role" are intentionally
# not ignored because they would also hide typos.
ignore_messages =
