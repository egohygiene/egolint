---
# ==============================================================================
# Ego Hygiene - Universal v8r Configuration
# ==============================================================================
#
# Purpose:
#   Validate YAML configuration files against matching JSON Schemas discovered
#   through SchemaStore and optional repository-owned catalogs.
#
# References:
#   https://github.com/chris48s/v8r
#   https://chris48s.github.io/v8r/
# ==============================================================================

$schema: "https://raw.githubusercontent.com/chris48s/v8r/main/config-schema.json"

# Keep human-readable output for local runs and MegaLinter reports.
outputFormat: "text"

# Validation failures must produce a nonzero exit code.
ignoreErrors: false

# Cache downloaded catalogs and schemas for one hour.
cacheTtl: 3600

# Apply repository ignore policy before attempting schema discovery.
ignorePatternFiles:
  - ".v8rignore"
  - ".gitignore"
