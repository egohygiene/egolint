; =============================================================================
; Ego Hygiene — Universal checkmake Configuration
; =============================================================================
;
; Purpose:
;   Provide a conservative structural baseline for first-party Makefiles.
;
; Notes:
;   - checkmake currently exposes only limited configuration.
;   - Avoid undocumented sections or inferred rule options.
;   - MegaLinter currently disables this linter because of upstream security
;     concerns, so this file is retained for future activation and local tests.
;
; References:
;   https://github.com/checkmake/checkmake
;   https://megalinter.io/latest/descriptors/makefile_checkmake/
; =============================================================================

[maxbodylength]

; Keep recipes reasonably small.
;
; Longer orchestration logic should move into:
;   - reusable Make functions;
;   - shell scripts under scripts/;
;   - Taskfile tasks;
;   - or dedicated tooling.
;
; Eight recipe lines matches the upstream checkmake baseline and avoids
; penalizing ordinary multi-step targets too aggressively.
maxBodyLength = 8
