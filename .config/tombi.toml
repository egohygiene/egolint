# Canonical repository-wide Tombi configuration.

toml-version = "v1.0.0"

[files]
respect-ignore-files = true
exclude = [
  ".cache/**",
  ".git/**",
  ".reports/**",
  "**/node_modules/**",
  "**/target/**",
  "tests/fixtures/negative/**",
]

[format.rules]
indent-style = "space"
indent-width = 2
line-ending = "lf"
line-width = 100

[lint.rules]
key-empty = "error"
dotted-keys-out-of-order = "warn"
tables-out-of-order = "warn"

[lsp]
code-action.enabled = true
completion.enabled = true
diagnostic.enabled = true
document-link.enabled = true
