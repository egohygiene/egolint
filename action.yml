name: Egolint check
description: Run a pinned, check-only Egolint policy against a repository.
author: Ego Hygiene

branding:
  color: purple
  icon: check-circle

inputs:
  workspace:
    description: Repository-relative directory to inspect.
    required: false
    default: "."
  profile:
    description: Named Egolint profile.
    required: false
    default: "fast"
  image:
    description: Digest-qualified egolint-full image reference.
    required: true
  allow-unpinned-image:
    description: Permit a local mutable image only for controlled smoke tests.
    required: false
    default: "false"
  pull-policy:
    description: Container pull behavior (always, missing, or never).
    required: false
    default: "always"
  network:
    description: Container network mode; bridge lets source-scanning tools reach the network.
    required: false
    default: "none"
  megalinter-config:
    description: Optional workspace-relative MegaLinter configuration path.
    required: false
    default: ""
  repository-contract:
    description: Optional workspace-relative repository-contract TOML path.
    required: false
    default: ""
  repository-continuity:
    description: Optional workspace-relative repository-continuity policy TOML path.
    required: false
    default: ""
  continuity-base:
    description: Explicit full base commit or unborn for continuity comparison.
    required: false
    default: ""
  continuity-head:
    description: Explicit full head commit or working-tree for continuity comparison.
    required: false
    default: ""
  continuity-disposition:
    description: Continuity result (updated, reviewed-no-change, or exception).
    required: false
    default: ""
  continuity-transition:
    description: Continuity lifecycle transition (pull-request or post-merge).
    required: false
    default: "pull-request"
  continuity-live-verification:
    description: Whether a separate authorized adapter supplied live evidence.
    required: false
    default: "unavailable"
  continuity-live-evidence:
    description: Optional comma-separated stable evidence URLs from that adapter.
    required: false
    default: ""
  continuity-parallel-heads:
    description: Optional comma-separated full candidate commits from the same base.
    required: false
    default: ""
  repository-intelligence:
    description: Optional workspace-relative Repository Intelligence policy TOML path.
    required: false
    default: ""
  repository-presentation:
    description: Optional workspace-relative repository-presentation policy TOML path.
    required: false
    default: ""
  represented-commit:
    description:
      Full represented Git commit; defaults to github.sha when semantic validation is enabled.
    required: false
    default: ""
  suppression:
    description: Optional workspace-relative reviewed suppression JSON path.
    required: false
    default: ""
  evaluation-date:
    description: Auditable YYYY-MM-DD date required with a suppression or continuity policy.
    required: false
    default: ""
  changed-only:
    description: Validate only files changed according to Git.
    required: false
    default: "true"

outputs:
  run-report:
    description: Workspace-relative canonical Egolint run report.
    value: ${{ steps.check.outputs.run-report }}
  sarif-report:
    description: Workspace-relative canonical Egolint SARIF report.
    value: ${{ steps.check.outputs.sarif-report }}
  repository-intelligence-report:
    description: Workspace-relative normalized Repository Intelligence validation report.
    value: ${{ steps.check.outputs.repository-intelligence-report }}
  repository-continuity-report:
    description: Workspace-relative privacy-safe repository-continuity validation report.
    value: ${{ steps.check.outputs.repository-continuity-report }}
  repository-presentation-report:
    description: Workspace-relative privacy-safe repository-presentation validation report.
    value: ${{ steps.check.outputs.repository-presentation-report }}
  debt-json:
    description:
      Workspace-relative dependency-debt JSON path; the file exists only for that profile.
    value: ${{ steps.check.outputs.debt-json }}
  debt-markdown:
    description:
      Workspace-relative dependency-debt Markdown path; the file exists only for that profile.
    value: ${{ steps.check.outputs.debt-markdown }}
  raw-megalinter-json:
    description: Workspace-relative private MegaLinter JSON; never publish without sanitizing.
    value: ${{ steps.check.outputs.raw-megalinter-json }}
  raw-megalinter-sarif:
    description: Workspace-relative private MegaLinter SARIF; never publish without sanitizing.
    value: ${{ steps.check.outputs.raw-megalinter-sarif }}
  exit-code:
    description: Egolint process exit code.
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - id: check
      name: Run Egolint check
      shell: bash
      env:
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_ALLOW_UNPINNED_IMAGE: ${{ inputs.allow-unpinned-image }}
        INPUT_PULL_POLICY: ${{ inputs.pull-policy }}
        INPUT_NETWORK: ${{ inputs.network }}
        INPUT_MEGALINTER_CONFIG: ${{ inputs.megalinter-config }}
        INPUT_REPOSITORY_CONTRACT: ${{ inputs.repository-contract }}
        INPUT_REPOSITORY_CONTINUITY: ${{ inputs.repository-continuity }}
        INPUT_CONTINUITY_BASE: ${{ inputs.continuity-base }}
        INPUT_CONTINUITY_HEAD: ${{ inputs.continuity-head }}
        INPUT_CONTINUITY_DISPOSITION: ${{ inputs.continuity-disposition }}
        INPUT_CONTINUITY_TRANSITION: ${{ inputs.continuity-transition }}
        INPUT_CONTINUITY_LIVE_VERIFICATION: ${{ inputs.continuity-live-verification }}
        INPUT_CONTINUITY_LIVE_EVIDENCE: ${{ inputs.continuity-live-evidence }}
        INPUT_CONTINUITY_PARALLEL_HEADS: ${{ inputs.continuity-parallel-heads }}
        INPUT_REPOSITORY_INTELLIGENCE: ${{ inputs.repository-intelligence }}
        INPUT_REPOSITORY_PRESENTATION: ${{ inputs.repository-presentation }}
        INPUT_REPRESENTED_COMMIT: ${{ inputs.represented-commit }}
        INPUT_SUPPRESSION: ${{ inputs.suppression }}
        INPUT_EVALUATION_DATE: ${{ inputs.evaluation-date }}
        INPUT_CHANGED_ONLY: ${{ inputs.changed-only }}
      run: "${GITHUB_ACTION_PATH}/scripts/github-action.sh"
