[project]
name = "egolint-toolchain"
version = "0.0.0"
description = "Private Python toolchain for developing and validating Egolint policies."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
authors = [
  { name = "Alan Szmyt" },
]
keywords = [
  "egolint",
  "linting",
  "developer tools",
  "quality",
]
dependencies = [
  "pyyaml>=6.0.3,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/egohygiene/egolint#readme"
Repository = "https://github.com/egohygiene/egolint"
Documentation = "https://github.com/egohygiene/egolint/tree/main/docs"
Issues = "https://github.com/egohygiene/egolint/issues"

[tool.uv]
package = false
conflicts = [
  [
    { group = "lint" },
    { group = "security" },
  ],
]

[dependency-groups]
test = [
  "pytest>=9.1.0,<10.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
]
lint = [
  "codespell>=2.4.2,<3.0.0",
  "complexipy==7.0.0",
  "deptry==0.24.0",
  "interrogate==1.7.0",
  "pre-commit==4.6.0",
  "ruff>=0.16.2,<0.17.0",
  "tombi==1.2.10",
  "vulture==2.16",
]
security = [
  "check-jsonschema>=0.37.3,<0.38.0",
  "detect-secrets==1.5.0",
  "reuse>=6.2.0,<7.0.0",
]
