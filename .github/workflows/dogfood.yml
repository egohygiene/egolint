---
name: Dogfood

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "dogfood-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  reference-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install locked JavaScript adapters
        run: |
          set -euo pipefail
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Install pinned Task runner
        run: |
          set -euo pipefail
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          "$(go env GOPATH)/bin/task" --version
          printf '%s\n' "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Dogfood Egolint
        run: task dogfood

      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: egolint-dogfood-${{ github.run_id }}
          # Tool caches can contain container-UID-private directories. Upload
          # the reviewable evidence surface explicitly instead of recursively
          # traversing disposable caches.
          path: |
            .reports/egolint/*.json
            .reports/egolint/*.sarif
            .reports/egolint/*.md
            .reports/egolint/*.log
            .reports/egolint/linters_logs/
            .reports/egolint/IDE-config/
          if-no-files-found: warn
