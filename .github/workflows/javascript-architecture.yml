---
name: JavaScript architecture

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: "javascript-architecture-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/13-javascript-package-quality

      - name: Apply one-time dependency-cruiser adapter repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/javascript_architecture.rs")
          text = path.read_text()

          if "use tempfile::NamedTempFile;" in text:
              text = text.replace("use tempfile::NamedTempFile;", "use tempfile::Builder;", 1)

          before_temp = '''    let mut config_file = NamedTempFile::new().map_err(|source| EgolintError::Filesystem {
        path: PathBuf::from("temporary-dependency-cruiser-config.json"),
        source,
    })?;'''
          after_temp = '''    let mut config_file = Builder::new()
        .prefix("egolint-dependency-cruiser-")
        .suffix(".json")
        .tempfile()
        .map_err(|source| EgolintError::Filesystem {
            path: PathBuf::from("temporary-dependency-cruiser-config.json"),
            source,
        })?;'''
          if before_temp in text:
              text = text.replace(before_temp, after_temp, 1)
          elif after_temp not in text:
              raise SystemExit("temporary-file block did not match expected source")

          before_output = '''    let code = output.status.code().unwrap_or(exit_code::RUNTIME);
    if !matches!(code, 0 | 1) {
        return Err(EgolintError::RuntimeExecution(format!(
            "dependency-cruiser exited with {code}: {}",
            bounded_text(&String::from_utf8_lossy(&output.stderr))
        )));
    }
    String::from_utf8(output.stdout).map_err(|error| {
        EgolintError::RuntimeExecution(format!(
            "dependency-cruiser emitted non-UTF-8 output: {error}"
        ))
    })'''
          after_output = '''    let code = output.status.code().unwrap_or(exit_code::RUNTIME);
    let stderr = bounded_text(&String::from_utf8_lossy(&output.stderr));
    if !matches!(code, 0 | 1) {
        return Err(EgolintError::RuntimeExecution(format!(
            "dependency-cruiser exited with {code}: {stderr}"
        )));
    }
    let stdout = String::from_utf8(output.stdout).map_err(|error| {
        EgolintError::RuntimeExecution(format!(
            "dependency-cruiser emitted non-UTF-8 output: {error}"
        ))
    })?;
    if stdout.trim().is_empty() {
        return Err(EgolintError::RuntimeExecution(format!(
            "dependency-cruiser produced no {output_type} output (exit {code}): {stderr}"
        )));
    }
    Ok(stdout)'''
          if before_output in text:
              text = text.replace(before_output, after_output, 1)
          elif after_output not in text:
              raise SystemExit("adapter-output block did not match expected source")

          path.write_text(text)
          PY
          cargo fmt --all

      - name: Commit adapter repair if needed
        run: |
          set -euo pipefail
          git add src/javascript_architecture.rs
          if git diff --cached --quiet; then
            printf '%s\n' 'Architecture adapter already repaired.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --message 'fix(architecture): harden dependency-cruiser adapter'
            git push origin HEAD:feat/13-javascript-package-quality
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install locked adapter toolchain
        run: |
          set -euo pipefail
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts
          test "$(pnpm exec depcruise --version)" = "18.2.0"

      - name: Prove clean React/Vite architecture
        run: |
          set -euo pipefail
          cargo run --quiet --locked --bin egolint-architecture -- \
            --workspace "tests/fixtures/javascript-architecture/clean" \
            --evaluation-date "2026-08-23" \
            --graph ".reports/egolint/javascript-architecture.dot"
          test -s "tests/fixtures/javascript-architecture/clean/.reports/egolint/javascript-architecture.dot"

      - name: Prove React/Vite boundary findings
        run: |
          set -euo pipefail
          set +e
          cargo run --quiet --locked --bin egolint-architecture -- \
            --workspace "tests/fixtures/javascript-architecture/react-vite" \
            --evaluation-date "2026-08-23"
          status="$?"
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("tests/fixtures/javascript-architecture/react-vite/.reports/egolint/javascript-architecture.json").read_text())
          rules = {item["rule"]["rule_id"] for item in report["findings"]}
          assert "no-app-to-app" in rules, rules
          assert "no-browser-to-node-core" in rules, rules
          assert "no-package-deep-import" in rules, rules
          assert report["dependency_cruiser_version"] == "18.2.0"
          PY

      - name: Prove package public-export boundary
        run: |
          set -euo pipefail
          set +e
          cargo run --quiet --locked --bin egolint-architecture -- \
            --workspace "tests/fixtures/javascript-architecture/library" \
            --evaluation-date "2026-08-23"
          status="$?"
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("tests/fixtures/javascript-architecture/library/.reports/egolint/javascript-architecture.json").read_text())
          assert any(item["rule"]["rule_id"] == "no-package-deep-import" for item in report["findings"])
          PY

      - name: Prove owned exception and expiry behavior
        run: |
          set -euo pipefail
          cargo run --quiet --locked --bin egolint-architecture -- \
            --workspace "tests/fixtures/javascript-architecture/library" \
            --overlay "architecture.overlay.json" \
            --evaluation-date "2026-08-23"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("tests/fixtures/javascript-architecture/library/.reports/egolint/javascript-architecture.json").read_text())
          assert report["summary"]["suppressed"] == 1, report["summary"]
          assert report["exceptions"][0]["state"] == "applied"
          PY
          set +e
          cargo run --quiet --locked --bin egolint-architecture -- \
            --workspace "tests/fixtures/javascript-architecture/library" \
            --overlay "architecture.overlay.json" \
            --evaluation-date "2026-09-02"
          status="$?"
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("tests/fixtures/javascript-architecture/library/.reports/egolint/javascript-architecture.json").read_text())
          assert report["summary"]["expired_exceptions"] == 1
          assert report["exceptions"][0]["state"] == "expired"
          PY

      - name: Validate SARIF projection
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("tests/fixtures/javascript-architecture/react-vite/.reports/egolint/javascript-architecture.sarif")
          sarif = json.loads(path.read_text())
          assert sarif["version"] == "2.1.0"
          assert sarif["runs"][0]["tool"]["driver"]["name"] == "Egolint"
          assert sarif["runs"][0]["results"]
          PY
