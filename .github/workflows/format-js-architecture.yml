name: Format JavaScript architecture source

on:
  pull_request:
    paths:
      - .github/workflows/format-js-architecture.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/12-javascript-architecture-profile
      - name: Apply rustfmt and commit exact output
        run: |
          set -euo pipefail
          cargo fmt --all
          git add src/javascript_architecture.rs src/bin/egolint-architecture.rs src/lib.rs
          if git diff --cached --quiet; then
            printf '%s\n' 'Rust sources already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --message 'style(architecture): apply rustfmt'
          git push origin HEAD:feat/12-javascript-architecture-profile
