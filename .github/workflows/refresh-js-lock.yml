name: Refresh JavaScript architecture lock

on:
  push:
    branches:
      - feat/12-javascript-architecture-profile
    paths:
      - .github/workflows/refresh-js-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/12-javascript-architecture-profile
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Refresh lockfile
        run: |
          set -euo pipefail
          corepack enable pnpm
          pnpm install --lockfile-only --ignore-scripts
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            printf '%s\n' 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --message 'build(architecture): lock dependency-cruiser adapter'
          git push origin HEAD:feat/12-javascript-architecture-profile
