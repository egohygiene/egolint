---
# yaml-language-server: $schema=https://raw.githubusercontent.com/oxsecurity/megalinter/main/megalinter/descriptors/schemas/megalinter-configuration.jsonschema.json

# MegaLinter repository-wide code-quality configuration.
#
# Configuration reference:
# https://megalinter.io/latest/configuration/
#
# Common variables:
# https://megalinter.io/latest/config-variables/

# ==============================================================================
# Core execution behavior
# ==============================================================================

# Do not apply formatter or linter fixes automatically.
#
# Fixes should be reviewed and applied deliberately through the dedicated local
# helper, autofix workflow, or a Copilot remediation task.
APPLY_FIXES: none

# Remove stale output from the report directory before each run.
#
# This ensures that published and uploaded reports represent only the current
# MegaLinter execution.
CLEAR_REPORT_FOLDER: true

# Preserve MegaLinter's blocking behavior. Any enabled blocking linter that
# reports an error causes the overall run to fail.
DISABLE_ERRORS: false

# Treat shell scripts without the executable permission bit as errors.
ERROR_ON_MISSING_EXEC_BIT: true

# ==============================================================================
# Linter activation
# ==============================================================================

# Keep all descriptor families enabled unless they are explicitly disabled
# elsewhere in this configuration.
DISABLE: []

# Disable individual linters that conflict with the canonical toolchain or are
# intentionally handled through another quality-control mechanism.
DISABLE_LINTERS:
  # DevSkim is currently excluded while its configuration and responsibility
  # within the wider security pipeline are reviewed.
  - REPOSITORY_DEVSKIM

  # JSON is validated through the selected JSON-specific toolchain rather than
  # eslint-plugin-jsonc.
  - JSON_ESLINT_PLUGIN_JSONC

  # Checkmake is disabled until the universal Makefile policy is finalized.
  - MAKEFILE_CHECKMAKE

  # MegaLinter v9.6.0 currently disables API_SPECTRAL internally because the
  # integration is marked as crashing. Preserve the native ruleset and wiring
  # so the linter can be re-enabled when upstream support is restored.
  - API_SPECTRAL

  # TERRAFORM_TERRASCAN is deprecated and will be removed in a future major release. Repo archived.
  - TERRAFORM_TERRASCAN

  # Disable the JSX linter in favor of the local repository pinned ESLint v9.
  - JSX_ESLINT
  - PYTHON_BLACK
  - PYTHON_FLAKE8
  - PYTHON_ISORT

# All enabled linters are blocking unless explicitly added here.
DISABLE_ERRORS_LINTERS: []

# ==============================================================================
# Repository scope
# ==============================================================================

# Extend MegaLinter's built-in exclusions with repository-specific generated,
# cached, virtual-environment, and deployment directories.
#
# Values are directory basenames and therefore match at any nesting level.
ADDITIONAL_EXCLUDED_DIRECTORIES:
  - __pycache__
  - .aws-sam
  - .cache
  - .dynamodb
  - .eslintcache
  - .gradle
  - .history
  - .mypy_cache
  - .next
  - .nuxt
  - .nyc_output
  - .output
  - .parcel-cache
  - .pnpm
  - .pytest_cache
  - .ruff_cache
  - .sbom
  - .scannerwork
  - .serverless
  - .terraform
  - .trivycache
  - .turbo
  - .venv
  - .vercel
  - .yarn
  - build
  - cmake-build
  - coverage
  - dist
  - logs
  - node_modules
  - out
  - reports
  - target
  - tmp
  - venv

# Ignore files explicitly marked as generated unless they also contain an
# @not-generated marker.
IGNORE_GENERATED_FILES: true

# Respect repository .gitignore rules when selecting files to lint.
IGNORE_GITIGNORED_FILES: true

# ==============================================================================
# Runtime and flavor behavior
# ==============================================================================

# Fail immediately when the selected MegaLinter image flavor does not contain
# a configured linter. This prevents silently incomplete quality checks.
FAIL_IF_MISSING_LINTER_IN_FLAVOR: true

# Do not fail merely because a formatter updated files.
#
# Automatic source modification is disabled globally, but this remains explicit
# so the behavior is stable if fixes are enabled for a dedicated workflow.
FAIL_IF_UPDATED_SOURCES: false

# Suppress recommendations to switch MegaLinter image flavors. Flavor selection
# is managed deliberately by the repository workflow.
FLAVOR_SUGGESTIONS: false

# Treat formatter findings as blocking errors rather than advisory warnings.
FORMATTERS_DISABLE_ERRORS: false

# Do not display security-related suggestions in the console output.
SECURITY_SUGGESTIONS: false

# ==============================================================================
# Default formatting policy
# ==============================================================================

# Prefer Prettier whenever MegaLinter must choose between its JavaScript
# Standard Style and Prettier implementations.
JAVASCRIPT_DEFAULT_STYLE: prettier

# ==============================================================================
# Linter configuration discovery
# ==============================================================================

# Use the repository's centralized lint-configuration directory as the default
# location for linter rules.
#
# Linters whose configurations live in nested domain directories will receive
# explicit *_RULES_PATH and *_CONFIG_FILE values later in this file.
LINTER_RULES_PATH: .config/lint

# ==============================================================================
# Logging
# ==============================================================================

# Write the complete MegaLinter execution log into the report output directory.
LOG_FILE: mega-linter.log

# Emit normal operational information without verbose debug output.
LOG_LEVEL: INFO

# ==============================================================================
# Default tool selection
# ==============================================================================

# Use markdownlint as the canonical Markdown style implementation.
MARKDOWN_DEFAULT_STYLE: markdownlint

# Use Ruff as the canonical Python linting implementation.
PYTHON_DEFAULT_STYLE: ruff

# Use Prettier as the canonical TypeScript formatting implementation.
TYPESCRIPT_DEFAULT_STYLE: prettier

# ==============================================================================
# Performance
# ==============================================================================

# Run independent linter groups concurrently.
#
# MegaLinter groups linters that may operate on the same files to reduce
# conflicts when source-fixing behavior is enabled.
PARALLEL: true

# Cap concurrent MegaLinter worker processes to avoid unbounded resource usage
# in local development, containers, and shared CI runners.
PARALLEL_PROCESS_NUMBER: 4

# ==============================================================================
# Reporting
# ==============================================================================

# Store all generated lint reports beneath the repository's engineering-output
# namespace.
REPORT_OUTPUT_FOLDER: .engineering/reports/megalinter

# Include total and per-linter execution timing in the console output.
SHOW_ELAPSED_TIME: true

# Keep skipped-linter noise out of normal output. The generated configuration
# report remains available when deeper activation debugging is necessary.
SHOW_SKIPPED_LINTERS: false

# ==============================================================================
# Console output
# ==============================================================================

# Disable MegaLinter's decorative alpaca output for cleaner CI logs.
PRINT_ALPACA: false

# Do not print every selected file before linting.
PRINT_ALL_FILES: false

# ==============================================================================
# Validation scope
# ==============================================================================

# Validate the entire repository by default.
#
# Pull-request workflows may override this to false so routine PR checks inspect
# only changed files, while scheduled and manual audits retain full-codebase
# validation.
VALIDATE_ALL_CODEBASE: true

# ==============================================================================
# File filtering
# ==============================================================================

# Exclude binary archives, packaged application artifacts, local database
# files, and minified assets from file-oriented linter execution.
#
# Directory exclusions are maintained separately through
# ADDITIONAL_EXCLUDED_DIRECTORIES to avoid duplicating scope policy.
#
# The inline (?x) flag enables verbose regular-expression mode so this pattern
# can remain readable across multiple lines. Whitespace and comments are ignored.
FILTER_REGEX_EXCLUDE: |-
  (?x)
  (
    # Repository-specific vendored, experimental, and generated trees.
    ^\.github/agents/copilot/awesome-copilot/
    |
    ^\.engineering/reports/megalinter/
    |
    ^\.staging/
    |
    ^docs/generated/
    |
    # Local databases.
    \.(?:db|sqlite|sqlite3)$
    |
    # Archives and packaged artifacts.
    \.(?:7z|gz|jar|rar|tar|tgz|war|zip)$
    |
    # Minified web assets.
    \.min\.[^/]+$
  )

# ==============================================================================
# GitHub Actions
# ==============================================================================

# actionlint
# https://github.com/rhysd/actionlint
# https://megalinter.io/latest/descriptors/action_actionlint/
ACTION_ACTIONLINT_RULES_PATH: .config/lint/actions
ACTION_ACTIONLINT_CONFIG_FILE: actionlint.yml

# ==============================================================================
# Ansible
# ==============================================================================

# ansible-lint
# https://ansible.readthedocs.io/projects/lint/
# https://megalinter.io/latest/descriptors/ansible_ansible_lint/

# ==============================================================================
# Ansible
# ==============================================================================

# ansible-lint
# https://ansible.readthedocs.io/projects/lint/
# https://megalinter.io/latest/descriptors/ansible_ansible_lint/

# Activate Ansible linting for repositories containing this conventional
# top-level workspace.
ANSIBLE_DIRECTORY: ansible

# Load the canonical repository-wide Ansible Lint configuration.
ANSIBLE_ANSIBLE_LINT_RULES_PATH: .config/lint/ansible
ANSIBLE_ANSIBLE_LINT_CONFIG_FILE: ansible-lint.yml

# Run once from the repository root so Ansible can resolve project context,
# roles, collections, requirements, and configuration correctly.
ANSIBLE_ANSIBLE_LINT_CLI_LINT_MODE: project

# Restrict Ansible Lint auto-discovery to the repository's Ansible workspace.
ANSIBLE_ANSIBLE_LINT_ARGUMENTS:
  - .ansible

# ==============================================================================
# API specifications
# ==============================================================================

# Spectral
# https://github.com/stoplightio/spectral
# https://megalinter.io/latest/descriptors/api_spectral/
#
# NOTE:
# MegaLinter v9.6.0 currently disables API_SPECTRAL internally because the
# integration is marked as crashing. Preserve the native ruleset and wiring
# so the linter can be re-enabled when upstream support is restored.
API_SPECTRAL_RULES_PATH: .config/lint/api
API_SPECTRAL_CONFIG_FILE: spectral.yaml

# ==============================================================================
# Azure Resource Manager templates
# ==============================================================================

# ARM Template Test Toolkit
# https://github.com/Azure/arm-ttk
# https://megalinter.io/latest/descriptors/arm_arm_ttk/
ARM_ARM_TTK_RULES_PATH: .config/lint/arm
ARM_ARM_TTK_CONFIG_FILE: arm-ttk.psd1

# ==============================================================================
# Clojure formatting
# ==============================================================================

# cljstyle
# https://github.com/greglook/cljstyle
# https://megalinter.io/latest/descriptors/clojure_cljstyle/
CLOJURE_CLJSTYLE_RULES_PATH: .config/lint/clojure
CLOJURE_CLJSTYLE_CONFIG_FILE: cljstyle.edn

# Do not format the formatter configuration or the clj-kondo configuration.
CLOJURE_CLJSTYLE_FILTER_REGEX_EXCLUDE: >-
  (^|/)\.config/lint/clojure/

# ==============================================================================
# Clojure static analysis
# ==============================================================================

# clj-kondo
# https://github.com/clj-kondo/clj-kondo
# https://megalinter.io/latest/descriptors/clojure_clj_kondo/
CLOJURE_CLJ_KONDO_RULES_PATH: .config/lint/clojure/.clj-kondo
CLOJURE_CLJ_KONDO_CONFIG_FILE: config.edn

# Do not lint centralized Clojure linter and formatter configurations as
# application source.
CLOJURE_CLJ_KONDO_FILTER_REGEX_EXCLUDE: >-
  (^|/)\.config/lint/clojure/

# ==============================================================================
# AWS CloudFormation
# ==============================================================================

# cfn-lint
# https://github.com/aws-cloudformation/cfn-lint
# https://megalinter.io/latest/descriptors/cloudformation_cfn_lint/
CLOUDFORMATION_CFN_LINT_RULES_PATH: .config/lint/cloudformation
CLOUDFORMATION_CFN_LINT_CONFIG_FILE: cfnlint.yml

# ==============================================================================
# CoffeeScript
# ==============================================================================

# CoffeeLint
# https://github.com/coffeelint/coffeelint
# https://megalinter.io/latest/descriptors/coffee_coffee_lint/
COFFEE_COFFEELINT_RULES_PATH: .config/lint/coffee
COFFEE_COFFEELINT_CONFIG_FILE: coffeelint.json

# ==============================================================================
# Copy/paste detection
# ==============================================================================

# jscpd
# https://github.com/kucherenko/jscpd
# https://megalinter.io/latest/descriptors/copypaste_jscpd/
COPYPASTE_JSCPD_RULES_PATH: .config/lint/copypaste
COPYPASTE_JSCPD_CONFIG_FILE: jscpd.json

# ==============================================================================
# C and C++ formatting
# ==============================================================================

# clang-format
# https://clang.llvm.org/docs/ClangFormat.html
# https://megalinter.io/latest/descriptors/cpp_clang_format/
CPP_CLANG_FORMAT_RULES_PATH: .config/lint/cpp
CPP_CLANG_FORMAT_CONFIG_FILE: .clang-format

# ==============================================================================
# C formatting
# ==============================================================================

# clang-format
# https://clang.llvm.org/docs/ClangFormat.html
# https://megalinter.io/latest/descriptors/c_clang_format/
C_CLANG_FORMAT_RULES_PATH: .config/lint/cpp
C_CLANG_FORMAT_CONFIG_FILE: .clang-format

# ==============================================================================
# CSS static analysis
# ==============================================================================

# Stylelint
# https://stylelint.io/
# https://megalinter.io/latest/descriptors/css_stylelint/
CSS_STYLELINT_RULES_PATH: .config/lint/css
CSS_STYLELINT_CONFIG_FILE: stylelint.json

# ==============================================================================
# Dart static analysis
# ==============================================================================

# Dart analyzer
# https://dart.dev/tools/dart-analyze
# https://megalinter.io/latest/descriptors/dart_dartanalyzer/
DART_DARTANALYZER_RULES_PATH: .config/lint/dart
DART_DARTANALYZER_CONFIG_FILE: analysis_options.yaml

# ==============================================================================
# Dockerfile static analysis
# ==============================================================================

# Hadolint
# https://github.com/hadolint/hadolint
# https://megalinter.io/latest/descriptors/dockerfile_hadolint/
DOCKERFILE_HADOLINT_RULES_PATH: .config/lint/dockerfile
DOCKERFILE_HADOLINT_CONFIG_FILE: hadolint.yaml

# ==============================================================================
# EditorConfig compliance
# ==============================================================================

# editorconfig-checker
# https://github.com/editorconfig-checker/editorconfig-checker
# https://megalinter.io/latest/descriptors/editorconfig_editorconfig_checker/
EDITORCONFIG_EDITORCONFIG_CHECKER_RULES_PATH: .config/lint/editorconfig
EDITORCONFIG_EDITORCONFIG_CHECKER_CONFIG_FILE: editorconfig-checker.json

# ==============================================================================
# Gherkin feature-file linting
# ==============================================================================

# gherkin-lint
# https://github.com/gherkin-lint/gherkin-lint
# https://megalinter.io/latest/descriptors/gherkin_gherkin_lint/
GHERKIN_GHERKIN_LINT_RULES_PATH: .config/lint/gherkin
GHERKIN_GHERKIN_LINT_CONFIG_FILE: gherkin-lint.json

# ==============================================================================
# Go static analysis
# ==============================================================================

# Revive
# https://github.com/mgechev/revive
# https://megalinter.io/latest/descriptors/go_revive/
GO_REVIVE_RULES_PATH: .config/lint/go
GO_REVIVE_CONFIG_FILE: revive.toml

# ==============================================================================
# GraphQL schema linting
# ==============================================================================

# graphql-schema-linter
# https://github.com/cjoudrey/graphql-schema-linter
# https://megalinter.io/latest/descriptors/graphql_graphql_schema_linter/
GRAPHQL_GRAPHQL_SCHEMA_LINTER_RULES_PATH: .config/lint/graphql
GRAPHQL_GRAPHQL_SCHEMA_LINTER_CONFIG_FILE: .graphql-schema-linterrc

GRAPHQL_GRAPHQL_SCHEMA_LINTER_ARGUMENTS: >-
  --config-directory
  .config/lint/graphql

# ==============================================================================
# Groovy and Jenkinsfile static analysis
# ==============================================================================

# npm-groovy-lint
# https://github.com/nvuillam/npm-groovy-lint
# https://megalinter.io/latest/descriptors/groovy_npm_groovy_lint/
GROOVY_NPM_GROOVY_LINT_RULES_PATH: .config/lint/groovy
GROOVY_NPM_GROOVY_LINT_CONFIG_FILE: .groovylintrc.json

# ==============================================================================
# HTML static analysis
# ==============================================================================

# HTMLHint
# https://htmlhint.com/
# https://megalinter.io/latest/descriptors/html_htmlhint/
HTML_HTMLHINT_RULES_PATH: .config/lint/html
HTML_HTMLHINT_CONFIG_FILE: htmlhint.json

# ==============================================================================
# JavaScript and TypeScript static analysis
# ==============================================================================

# ESLint
# https://eslint.org/
# https://megalinter.io/latest/descriptors/javascript_eslint/
JAVASCRIPT_ES_RULES_PATH: .config/lint/javascript
JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs
JAVASCRIPT_ES_ARGUMENTS: >-
  --cache
  --cache-location .cache/eslint/javascript
  --cache-strategy content

JAVASCRIPT_ES_PRE_COMMANDS:
  - command: >-
      mkdir -p
      ".cache/eslint/javascript"
    cwd: workspace

# ==============================================================================
# Prettier formatting
# ==============================================================================

# Prettier
# https://prettier.io/
# https://megalinter.io/latest/descriptors/javascript_prettier/
JAVASCRIPT_PRETTIER_RULES_PATH: .config/lint/javascript
JAVASCRIPT_PRETTIER_CONFIG_FILE: prettier.config.mjs

# ==============================================================================
# Java static analysis
# ==============================================================================

# Checkstyle
# https://checkstyle.org/
# https://megalinter.io/latest/descriptors/java_checkstyle/
JAVA_CHECKSTYLE_RULES_PATH: .config/lint/java/checkstyle
JAVA_CHECKSTYLE_CONFIG_FILE: checkstyle.xml

# ==============================================================================
# Java code-quality analysis
# ==============================================================================

# PMD
# https://pmd.github.io/
# https://megalinter.io/latest/descriptors/java_pmd/
JAVA_PMD_RULES_PATH: .config/lint/java/pmd
JAVA_PMD_CONFIG_FILE: java-pmd-ruleset.xml

# ==============================================================================
# JSON syntax validation
# ==============================================================================

# jsonlint
# https://github.com/prantlf/jsonlint
# https://megalinter.io/latest/descriptors/json_jsonlint/
JSON_JSONLINT_RULES_PATH: .config/lint/json
JSON_JSONLINT_CONFIG_FILE: jsonlint.json

# ==============================================================================
# JSON formatting
# ==============================================================================

# Prettier
# https://prettier.io/
# https://megalinter.io/latest/descriptors/json_prettier/
JSON_PRETTIER_RULES_PATH: .config/lint/javascript
JSON_PRETTIER_CONFIG_FILE: prettier.config.mjs

# ==============================================================================
# JSX static analysis
# ==============================================================================

# ESLint
# https://eslint.org/
# https://megalinter.io/latest/descriptors/jsx_eslint/
JSX_ESLINT_RULES_PATH: .config/lint/javascript
JSX_ESLINT_CONFIG_FILE: eslint.config.mjs
JSX_ESLINT_ARGUMENTS: >-
  --cache
  --cache-location .cache/eslint/jsx
  --cache-strategy content

JSX_ESLINT_PRE_COMMANDS:
  - command: >-
      mkdir -p
      ".cache/eslint/jsx"
    cwd: workspace

# ==============================================================================
# LaTeX semantic analysis
# ==============================================================================

# ChkTeX
# https://www.nongnu.org/chktex/
# https://megalinter.io/latest/descriptors/latex_chktex/
LATEX_CHKTEX_RULES_PATH: .config/lint/latex
LATEX_CHKTEX_CONFIG_FILE: .chktexrc

# ==============================================================================
# Lua static analysis
# ==============================================================================

# Luacheck
# https://github.com/lunarmodules/luacheck
# https://megalinter.io/latest/descriptors/lua_luacheck/
LUA_LUACHECK_RULES_PATH: .config/lint/lua
LUA_LUACHECK_CONFIG_FILE: .luacheckrc

# ==============================================================================
# Makefile static analysis
# ==============================================================================

# checkmake
# https://github.com/checkmake/checkmake
# https://megalinter.io/latest/descriptors/makefile_checkmake/
#
# NOTE:
# MegaLinter currently disables this descriptor because of upstream security
# concerns. Keep the configuration ready, but retain MAKEFILE_CHECKMAKE in
# DISABLE_LINTERS until MegaLinter re-enables it.
MAKEFILE_CHECKMAKE_RULES_PATH: .config/lint/makefile
MAKEFILE_CHECKMAKE_CONFIG_FILE: .checkmake.ini

# ==============================================================================
# Markdown static analysis
# ==============================================================================

# markdownlint
# https://github.com/DavidAnson/markdownlint
# https://megalinter.io/latest/descriptors/markdown_markdownlint/
MARKDOWN_MARKDOWNLINT_RULES_PATH: .config/lint/markdown
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.json

# ==============================================================================
# Markdown link validation
# ==============================================================================

# markdown-link-check
# https://github.com/tcort/markdown-link-check
# https://megalinter.io/latest/descriptors/markdown_markdown_link_check/
MARKDOWN_MARKDOWN_LINK_CHECK_RULES_PATH: .config/lint/markdown
MARKDOWN_MARKDOWN_LINK_CHECK_CONFIG_FILE: .markdown-link-check.json
MARKDOWN_MARKDOWN_LINK_CHECK_FILTER_REGEX_EXCLUDE: '(^|/)(node_modules|vendor|dist|build|coverage|\.cache|\.engineering/reports)/'

# ==============================================================================
# Markdown AST analysis
# ==============================================================================

# remark-lint
# https://github.com/remarkjs/remark-lint
# https://megalinter.io/latest/descriptors/markdown_remark_lint/
MARKDOWN_REMARK_LINT_RULES_PATH: .config/lint/markdown
MARKDOWN_REMARK_LINT_CONFIG_FILE: .remarkrc.json
MARKDOWN_REMARK_LINT_FILTER_REGEX_EXCLUDE: '(^|/)(node_modules|vendor|dist|build|coverage|\.cache|\.engineering/reports)/'

# ==============================================================================
# PHP analysis
# ==============================================================================

# PHP_CodeSniffer
# https://github.com/PHPCSStandards/PHP_CodeSniffer/
# https://megalinter.io/latest/descriptors/php_phpcs/
PHP_PHPCS_RULES_PATH: .config/lint/php
PHP_PHPCS_CONFIG_FILE: phpcs.xml
PHP_PHPCS_FILTER_REGEX_EXCLUDE: '(^|/)(vendor|node_modules|build|dist|coverage|\.cache|storage/framework|bootstrap/cache)/'

# PHPLint
# https://github.com/overtrue/phplint
# https://megalinter.io/latest/descriptors/php_phplint/
PHP_PHPLINT_RULES_PATH: .config/lint/php
PHP_PHPLINT_CONFIG_FILE: .phplint.yml
PHP_PHPLINT_FILTER_REGEX_EXCLUDE: '(^|/)(vendor|node_modules|build|dist|coverage|\.cache|storage/framework|bootstrap/cache)/'

# PHPStan
# https://phpstan.org/
# https://megalinter.io/latest/descriptors/php_phpstan/
PHP_PHPSTAN_RULES_PATH: .config/lint/php
PHP_PHPSTAN_CONFIG_FILE: phpstan.neon.dist
PHP_PHPSTAN_FILTER_REGEX_EXCLUDE: '(^|/)(vendor|node_modules|build|dist|coverage|\.cache|storage/framework|bootstrap/cache)/'

# Psalm
# https://psalm.dev/
# https://megalinter.io/latest/descriptors/php_psalm/
PHP_PSALM_RULES_PATH: .config/lint/php
PHP_PSALM_CONFIG_FILE: psalm.xml
PHP_PSALM_FILTER_REGEX_EXCLUDE: '(^|/)(vendor|node_modules|build|dist|coverage|\.cache|storage/framework|bootstrap/cache)/'

# ==============================================================================
# PowerShell analysis and formatting
# ==============================================================================

# PSScriptAnalyzer
# https://github.com/PowerShell/PSScriptAnalyzer
# https://megalinter.io/latest/descriptors/powershell_powershell/
POWERSHELL_POWERSHELL_RULES_PATH: .config/lint/powershell
POWERSHELL_POWERSHELL_CONFIG_FILE: powershell-psscriptanalyzer.psd1
POWERSHELL_POWERSHELL_FILTER_REGEX_EXCLUDE: '(^|/)(node_modules|vendor|dist|build|coverage|\.cache|\.engineering/reports)/'

# PowerShell formatter
# https://github.com/PowerShell/PSScriptAnalyzer
# https://megalinter.io/latest/descriptors/powershell_powershell_formatter/
POWERSHELL_POWERSHELL_FORMATTER_RULES_PATH: .config/lint/powershell
POWERSHELL_POWERSHELL_FORMATTER_CONFIG_FILE: powershell-formatter.psd1
POWERSHELL_POWERSHELL_FORMATTER_FILTER_REGEX_EXCLUDE: '(^|/)(node_modules|vendor|dist|build|coverage|\.cache|\.engineering/reports)/'

# ==============================================================================
# Protocol Buffer static analysis
# ==============================================================================

# protolint
# https://github.com/yoheimuta/protolint
# https://megalinter.io/latest/descriptors/protobuf_protolint/
PROTOBUF_PROTOLINT_RULES_PATH: .config/lint/protobuf
PROTOBUF_PROTOLINT_CONFIG_FILE: .protolintrc.yml
PROTOBUF_PROTOLINT_FILTER_REGEX_EXCLUDE: '(^|/)(vendor|node_modules|generated|build|dist|coverage|\.cache|\.engineering/reports)/'

# ==============================================================================
# Puppet static analysis
# ==============================================================================

# puppet-lint
# https://github.com/puppetlabs/puppet-lint
# https://megalinter.io/latest/descriptors/puppet_puppet_lint/
#
# NOTE:
# The MegaLinter descriptor is currently disabled upstream. Keep this
# configuration prepared, but retain PUPPET_PUPPET_LINT in DISABLE_LINTERS
# until MegaLinter restores support.
PUPPET_PUPPET_LINT_RULES_PATH: .config/lint/puppet
PUPPET_PUPPET_LINT_CONFIG_FILE: .puppet-lint.rc
PUPPET_PUPPET_LINT_FILTER_REGEX_EXCLUDE: '(^|/)(vendor|node_modules|generated|build|dist|coverage|\.cache|\.engineering/reports)/'

# ==============================================================================
# Raku syntax and compilation validation
# ==============================================================================

# Raku
# https://raku.org/
# https://megalinter.io/latest/descriptors/raku_raku/
RAKU_RAKU_CONFIG_FILE: LINTER_DEFAULT

# ==============================================================================
# Repository file and directory naming
# ==============================================================================

# ls-lint
# https://github.com/loeffel-io/ls-lint
# https://megalinter.io/latest/descriptors/repository_ls_lint/
REPOSITORY_LS_LINT_RULES_PATH: .config/lint/repo
REPOSITORY_LS_LINT_CONFIG_FILE: .ls-lint.yml

# ==============================================================================
# Repository spell checking
# ==============================================================================

# CSpell
# https://github.com/streetsidesoftware/cspell
# https://megalinter.io/latest/descriptors/spell_cspell/
SPELL_CSPELL_RULES_PATH: .config/lint/prose/spell
SPELL_CSPELL_CONFIG_FILE: cspell.megalinter.json

# CSpell is a repository-wide scanner, but MegaLinter still needs at least one
# applicable file type to activate the descriptor.
# SPELL_CSPELL_CLI_LINT_MODE: project
# SPELL_CSPELL_FILE_EXTENSIONS:
#   - "*"

SPELL_CSPELL_CLI_LINT_MODE: list_of_files
SPELL_CSPELL_FILE_EXTENSIONS:
  - ".txt"
SPELL_CSPELL_FILTER_REGEX_INCLUDE: '^tests/fixtures/cspell/valid\.txt$'

# File-name spelling creates substantial noise in a large polyglot repository.
# ls-lint owns repository naming conventions separately.
SPELL_CSPELL_ANALYZE_FILE_NAMES: false

SPELL_CSPELL_PRE_COMMANDS:
  - command: >-
      mkdir -p ".cache/cspell" ".engineering/reports/megalinter/cspell"
      && test -f "node_modules/@cspell/dict-clojure/cspell-ext.json"
      && test -f "node_modules/@cspell/dict-elisp/cspell-ext.json"
      && test -f "node_modules/@cspell/dict-gdscript/cspell-ext.json"
      && test -f "node_modules/@cspell/dict-gis/cspell-ext.json"
      && test -f "node_modules/@cspell/dict-medicalterms/cspell-ext.json"
      && test -f "node_modules/@cspell/dict-mime-types/cspell-ext.json"
      && test -f "node_modules/@cspell/dict-mnemonics/cspell-ext.json"
      && test -f "node_modules/@cspell/dict-people-names/cspell-ext.json"
      && test -f "node_modules/@cspell/dict-pokemon/cspell-ext.json"
      && test -f "node_modules/@cspell/dict-redis/cspell-ext.json"
      && test -f "node_modules/@cspell/dict-scientific-terms-us/cspell-ext.json"
      && test -f "node_modules/@cspell/dict-vim/cspell-ext.json"
      && test -f "node_modules/@cspell/dict-win32/cspell-ext.json"
      && test -d "node_modules/@cspell/cspell-json-reporter"
    cwd: workspace

