# ==============================================================================
# Reporters
# ==============================================================================
#
# Reporter strategy:
#   - Console output for local and CI diagnostics.
#   - Text logs for detailed per-linter artifacts.
#   - Markdown summary for readable CI and GitHub summaries.
#   - JSON for downstream automation and report processing.
#   - SARIF for GitHub code-scanning integration where supported.
#   - GitHub PR comments and statuses for pull-request feedback.
#
# External delivery reporters remain disabled to avoid unnecessary data transfer.
# ==============================================================================

# ------------------------------------------------------------------------------
# Platform-specific pull-request comments
# ------------------------------------------------------------------------------
AZURE_COMMENT_REPORTER: false
BITBUCKET_COMMENT_REPORTER: false
GITLAB_COMMENT_REPORTER: false

# Only relevant if the GitLab reporter is later enabled.
GITLAB_COMMENT_REPORTER_OVERWRITE_COMMENT: true

# GitHub is the canonical hosting platform.
GITHUB_COMMENT_REPORTER: true
GITHUB_STATUS_REPORTER: true

# Generate the full Markdown report with detailed linter sections.
REPORTERS_MARKDOWN_TYPE: advanced
REPORTERS_MARKDOWN_SUMMARY_TYPE: table-sections

# ------------------------------------------------------------------------------
# Console output
# ------------------------------------------------------------------------------
CONSOLE_REPORTER: true
CONSOLE_REPORTER_SECTIONS: true

# Show only files with findings in routine console output.
OUTPUT_DETAIL: simple

# ------------------------------------------------------------------------------
# Text artifacts
# ------------------------------------------------------------------------------
TEXT_REPORTER: true
TEXT_REPORTER_SUB_FOLDER: linters_logs

# ------------------------------------------------------------------------------
# Markdown summary
# ------------------------------------------------------------------------------
MARKDOWN_SUMMARY_REPORTER: true
MARKDOWN_SUMMARY_REPORTER_FILE_NAME: megalinter-summary.md

# ------------------------------------------------------------------------------
# Machine-readable artifacts
# ------------------------------------------------------------------------------
JSON_REPORTER: true
JSON_REPORTER_OUTPUT_DETAIL: detailed

SARIF_REPORTER: true
SARIF_REPORTER_FILE_NAME: megalinter-report.sarif

# Empty means all SARIF-capable linters may contribute.
SARIF_REPORTER_LINTERS: []

# ------------------------------------------------------------------------------
# IDE configuration artifact
# ------------------------------------------------------------------------------
CONFIG_REPORTER: true
CONFIG_REPORTER_SUB_FOLDER: IDE-config

# ------------------------------------------------------------------------------
# Updated-source artifacts
# ------------------------------------------------------------------------------

# Do not collect modified source files during normal validation runs.
#
# Autofixes are disabled by default, and local runs may begin with an
# intentionally dirty worktree. Enabling this reporter would therefore copy
# unrelated pre-existing changes and can recursively inspect report output.
UPDATED_SOURCES_REPORTER: false
UPDATED_SOURCES_REPORTER_DIR: updated_sources

# ------------------------------------------------------------------------------
# External delivery
# ------------------------------------------------------------------------------
EMAIL_REPORTER: false
FILEIO_REPORTER: false
FILEIO_REPORTER_SEND_SUCCESS: false

# ------------------------------------------------------------------------------
# Test Anything Protocol
# ------------------------------------------------------------------------------

# TAP changes execution behavior, forces list-of-files linters into file mode,
# and disables project-mode linters. Keep it disabled.
TAP_REPORTER: false
TAP_REPORTER_SUB_FOLDER: tap

POST_COMMANDS:
  - command: echo "Megalinter completed successfully."
    cwd: "workspace"
    continue_if_failed: true
